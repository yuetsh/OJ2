# 本机开发用的依赖服务。判题沙箱单独放，因为它要挂载测试用例目录。
#
# 起：  docker compose -f docker/compose.dev.yml up -d      （= bun run db:up）
# 停：  docker compose -f docker/compose.dev.yml down
# 清空：docker compose -f docker/compose.dev.yml down -v   ← 会删掉库里的数据
#
# 起完库是空的，结构由迁移自己建：
#
#   bun run db:migrate    # 空库从 0000 自举出全部结构
#   bun run seed:dev      # 可选，建两个本机用的账号
#
# 以前这里挂一份 schema dump 当 initdb，现在不需要了 —— 0000 就是完整的建表迁移，
# 而且和「灌 dump + 打基线 + 跑迁移」跑出来的结构实测零差异（见 docs/database.md）。
#
# PostgreSQL 的大版本跟生产走（现在是 18）—— 别图新单独换本机的，
# 开发环境用了生产不支持的特性，要到上线那天才炸。
#
# 判题机 token 必须自己生成，仓库里不留默认值。第一次起服务前：
#
#   TOKEN=$(openssl rand -hex 32)
#   echo "OJ2_JUDGE_TOKEN=$TOKEN"    >> docker/.env   # docker compose 读这里
#   echo "JUDGE_SERVER_TOKEN=$TOKEN" >> .env          # 后端读这里，两边必须一致
#
# 两个变量名不同但值必须相同：ES_AUTH_TOKEN 是判题机（go-judge）认的名字，JUDGE_SERVER_TOKEN
# 是后端认的名字。忘了设 OJ2_JUDGE_TOKEN 的话 docker compose 会直接报错退出；忘了设
# JUDGE_SERVER_TOKEN 的话后端会随机生成一个并在启动日志里告警，判题请求会被 401 挡掉。

services:
  postgres:
    image: postgres:18-alpine
    container_name: oj2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: onlinejudge
    ports:
      - "127.0.0.1:5433:5432" # 5433 避开可能存在的本机 5432
    volumes:
      # 18 起镜像把数据目录挪到了 /var/lib/postgresql/18/docker，挂载点要是上一级。
      # 还挂 .../data 的话 18 直接拒绝启动。卷名带版本号：16 的旧卷 oj2-pgdata 不认得，
      # 换卷才不会撞（docker volume rm docker_oj2-pgdata 可以清掉）
      - oj2-pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinejudge -d onlinejudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: oj2-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # 6380 避开可能存在的本机 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge:
    # 自己构建的判题沙箱（go-judge + gcc / python，见 docker/judge/）。
    # ⚠️ 这个 tag 不在任何 registry 上：本机 docker/judge/build.sh 构建，
    #    服务器/机房用 docker load 装。镜像不在本地时 compose 会去 pull 然后报找不到。
    image: oj2-judge-3
    container_name: oj2-judge
    restart: unless-stopped
    # go-judge 要自己建 namespace 和 cgroup 来关学生程序，只能给特权，理由见 docker/judge/README.md
    privileged: true
    # go-judge 的文件存储（编译产物、程序输出）放这里，见 Dockerfile 的 -dir
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../data/test_case:/test_case:ro
    environment:
      # 没有默认值是故意的：写死在仓库里的弱 token 等于没有 token。
      # 未设置时 docker compose 直接报错，不会静默起一个人人可连的判题机。
      ES_AUTH_TOKEN: ${OJ2_JUDGE_TOKEN:?请先设置 OJ2_JUDGE_TOKEN，见本文件顶部注释}
    mem_limit: 512m

volumes:
  oj2-pgdata18:
